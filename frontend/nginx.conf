# ============================================================
# 企业智库 AI — Nginx 生产配置
# Phase 10: SSE 流式支持、上传代理、安全响应头、缓存策略
# ============================================================

server {
    listen 80;
    server_name localhost;

    # 隐藏 Nginx 版本
    server_tokens off;

    # 访问日志（生产环境）
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # 根路径 — SPA 静态文件
    root /usr/share/nginx/html;
    index index.html;

    # ---- 基础安全响应头 ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # CSP: report-only 模式，先观察不阻断
    # 正式启用 CSP 前需确认所有前端资源来源
    # add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self';" always;

    # ---- Gzip 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_proxied any;
    # 不对 SSE/流式响应启用 gzip（避免缓冲）
    gzip_disable "text/event-stream";

    # ---- 禁止访问敏感路径 ----
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~* (\.env|\.git|docker-compose) {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~* /(storage|data|models|backup)/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 禁止目录列表
    autoindex off;

    # ---- API 反向代理 ----
    location /api/ {
        proxy_pass http://backend:8000;

        # 请求头转发
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # HTTP/1.1 持久连接（SSE 需要）
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 禁用缓冲以支持 SSE 流式响应
        proxy_buffering off;
        proxy_cache off;

        # 告诉后端这是代理请求（避免后端重复缓冲）
        proxy_set_header X-Accel-Buffering no;

        # ---- 超时配置 ----
        # 流式聊天接口使用较长超时
        location /api/v1/chat/ {
            proxy_pass http://backend:8000;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            # SSE 相关
            chunked_transfer_encoding on;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header X-Accel-Buffering no;
            # 防止 Nginx 重试 POST（避免流式消息重复）
            proxy_next_upstream off;
            # 不缓冲响应
            proxy_request_buffering off;
        }

        # RAG 问答接口较长超时
        location /api/v1/rag/ {
            proxy_pass http://backend:8000;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header X-Accel-Buffering no;
            proxy_next_upstream off;
        }

        # 上传接口专用超时
        location /api/v1/documents/upload/ {
            proxy_pass http://backend:8000;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            # 上传文件大小限制（与后端 MAX_UPLOAD_SIZE_MB 协调）
            client_max_body_size 55m;
            # 关闭请求缓冲（流式上传直通后端）
            proxy_request_buffering off;
            proxy_next_upstream off;
        }

        # 默认 API 超时（更短）
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # 默认上传大小限制
        client_max_body_size 55m;
    }

    # ---- SPA 路由回退 ----
    # 所有非文件请求回退到 index.html（Vue Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 禁止缓存，确保部署后浏览器获取最新版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ---- 静态资源缓存 ----
    # 带 hash 的 JS/CSS 文件可以长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # favicon 和 robots.txt 轻度缓存
    location = /favicon.ico {
        expires 7d;
        add_header Cache-Control "public";
    }
    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public";
    }

    # ---- API 响应不缓存 ----
    location ~ ^/api/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
