# ============================================================
# 企业智库 AI — Docker Compose 一键部署
# ============================================================
#
# ⛔ 严禁: docker compose down -v （删除 volume 导致数据永久丢失）
# ⛔ 严禁: docker volume rm yujian_storage yujian_data
# ✅ 安全停止: docker compose stop
# ✅ 安全重启: docker compose up -d
#
# 启动:  docker compose up -d
# 停止:  docker compose stop    ← 安全，保留数据
# 重建:  docker compose build && docker compose up -d
# 升级:  bash scripts/backup.sh && docker compose build && docker compose up -d
#
# 数据持久化:
#   - models              → Embedding / Reranker 本地模型（bind mount 只读）
#   - yujian_storage      → SQLite 数据库 + Chroma向量库 + 日志 + 备份（named volume）
#   - yujian_data         → 上传文件（named volume）
#
# 使用 Docker named volume 确保数据持久化。
# VOLUME 不可删除！升级/重建容器时数据保留。
# 备份: docker run --rm -v yujian_storage:/data -v $(pwd)/backup:/backup alpine tar czf /backup/storage_backup.tar.gz -C /data .
# 容器重启后以上数据不丢失。
# ============================================================

services:
  # ---- FastAPI 后端 ----
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: yujian-rag-backend:latest
    container_name: yujian-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    environment:
      - ANONYMIZED_TELEMETRY=false
    volumes:
      # 模型持久化（Embedding + Reranker）
      - ./models:/app/models:ro
      # 数据库 + Chroma向量库 + 日志 + 备份（named volume - 旧数据所在）
      - yujian_storage:/app/storage
      # 上传文件（named volume - 内部有 uploads/ 子目录）
      - yujian_data:/app/data
    networks:
      - yujian-net
    # 等待模型和存储就绪后启动
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ---- Nginx 前端 ----
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: yujian-rag-frontend:latest
    container_name: yujian-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - yujian-net

# ---- 持久化存储卷（external, 不可删除） ----
volumes:
  yujian_storage:
    external: true
  yujian_data:
    external: true

# ---- 内部网络 ----
networks:
  yujian-net:
    driver: bridge
